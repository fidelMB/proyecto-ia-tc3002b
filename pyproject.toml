[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402", "F401", "B018", "E501", "I001"]
"src/generate_project_artifacts.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
